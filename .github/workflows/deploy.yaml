name: Build and Deploy to GitHub Pages and docker Hub
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest

      - name: Update Helm Values with image tag
        run: |
          echo "Updating Helm chart values with new image tag..."
          sed -i 's|repository: .*|repository: '"${{ secrets.DOCKER_USERNAME }}/my-app"'|g' ./charts/app/values.yaml
          sed -i 's|tag: .*|tag: latest|g' ./charts/app/values.yaml
          cat ./charts/app/values.yaml

      - name: Commit and push Helm chart changes
        run: |
          git config --global user.name "perolasanta"
          git config --global user.email "peteroebello@gmail.com "
          git add ./charts/app/values.yaml
          git commit -m "Update Helm chart with new Docker image tag"
          git push origin main
