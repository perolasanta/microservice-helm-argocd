name: Build and Deploy to GitHub Pages and docker Hub
on:
  push:
    branches:
      - [main, ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image tag
        id: tag
        run: |
          SHORT_SHA= $(git rev-parse --short HEAD) # Get the short SHA of the commit
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT # Set output variable
          echo "Image tag: ${SHORT_SHA}" >> $GITHUB_ENV # Set environment variable

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/flaskapp:${{steps.tag.outputs.tag}}

      - name: Update Helm Values with image tag
        run: |
          echo "Updating Helm chart values with new image tag..."
          sed -i 's|repository: .*|repository: '"${{ secrets.DOCKER_USERNAME }}/flaskapp"'|g' ./charts/app/values.yaml
          sed -i 's|tag: .*|tag: ${{steps.tag.outputs.tag}}|g' ./charts/app/values.yaml
          cat ./charts/app/values.yaml

      - name: Commit and push Helm chart changes
        run: |
          git config --global user.name "perolasanta"
          git config --global user.email "peteroebello@gmail.com "
          git add ./charts/app/values.yaml
          git commit -m "Update Helm chart with new Docker image tag: 
          ${{steps.tag.outputs.tag}}"
          || echo "No changes to commit"
          git push origin main
