apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-helm-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/petbell/microservice-helm-argocd
    targetRevision: HEAD
    path: charts/app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
